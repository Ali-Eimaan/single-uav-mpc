# Fast, no-build lint gate. Should finish in under two minutes so it is the first thing a
# contributor sees fail.
#
# Python lint settings live in the committed setup.cfg (flake8) and pyproject.toml (black);
# YAML settings in .yamllint. No inline flags — otherwise the local run and the CI run drift.

name: format check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # REQUIRED for the container job. A job with `container:` gets /bin/sh (dash) by default,
    # and `. /opt/ros/$ROS_DISTRO/setup.bash` is full of bash-isms — under dash it fails with
    # "Bad substitution" / "builtin: not found" and the job dies on its first step.
    shell: bash

jobs:
  cpp:
    name: C++ (ament linters)
    runs-on: ubuntu-26.04
    container:
      image: ros:lyrical-ros-base
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # This job runs INSIDE the container as root, so apt-get needs no sudo (and sudo is not
      # installed). The runner-hosted jobs below are the opposite — see their steps.
      #
      # The ros-lyrical-ament-* linter debs are published, so install them and fail loudly if
      # that ever stops being true. A previous from-source fallback created a venv without
      # installing python3-venv first and died on "ensurepip is not available"; a fallback that
      # cannot run is worse than no fallback.
      - name: Install ament linters
        run: |
          set -exo pipefail
          # NOTE: no `-u`. ROS setup files reference unset variables
          # (AMENT_TRACE_SETUP_FILES and friends), so `set -u` makes sourcing them abort
          # with "unbound variable" before anything runs.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ros-${ROS_DISTRO}-ament-cmake-cpplint \
            ros-${ROS_DISTRO}-ament-cmake-uncrustify
          # The binaries install under /opt/ros/$ROS_DISTRO/bin, which is NOT on PATH
          # until setup.bash is sourced -- Actions bypasses the image entrypoint that
          # would normally do it. Source first, then prove they are reachable.
          source /opt/ros/${ROS_DISTRO}/setup.bash
          command -v ament_cpplint
          command -v ament_uncrustify

      # clang-format is deliberately NOT a gate. It and uncrustify are competing formatters and
      # disagree irreconcilably on clang-format 21 (`{ return x; }` vs `{return x;}`,
      # `template <T>` vs `template<T>`). ament_lint_common ships uncrustify + cpplint and omits
      # clang-format for exactly this reason. `.clang-format` is kept as an editor aid only.
      # Do not re-add a clang-format step here.

      - name: cpplint
        run: |
          set -exo pipefail
          # NOTE: no `-u`. ROS setup files reference unset variables
          # (AMENT_TRACE_SETUP_FILES and friends), so `set -u` makes sourcing them abort
          # with "unbound variable" before anything runs.
          source /opt/ros/${ROS_DISTRO}/setup.bash
          ament_cpplint --linelength 100 uav_mpc/src uav_mpc/include uav_mpc/test

      - name: uncrustify (fail on any diff, print the fix)
        run: |
          set -eo pipefail
          # NOTE: no `-u`. ROS setup files reference unset variables
          # (AMENT_TRACE_SETUP_FILES and friends), so `set -u` makes sourcing them abort
          # with "unbound variable" before anything runs.
          source /opt/ros/${ROS_DISTRO}/setup.bash
          if ! ament_uncrustify --linelength 100 \
              uav_mpc/src uav_mpc/include uav_mpc/test; then
            echo "::error::uncrustify would reformat the sources above. Fix with:"
            echo "  ament_uncrustify --linelength 100 --reformat uav_mpc/src uav_mpc/include uav_mpc/test"
            exit 1
          fi

  python:
    name: Python (black / flake8)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # This job uses actions/setup-python, so PEP 668 does not apply and no venv is needed.
      # black and flake8 are pinned in requirements.txt — read the versions from there rather
      # than restating them, so the two cannot drift.
      #
      # The sed must stop at the first space or '#'. requirements.txt carries trailing
      # verification comments, and `flake8==7.3.0          # verified ...` is not a valid
      # requirement specifier — pip rejects it outright.
      - name: Install pinned linters
        run: |
          set -euo pipefail
          black_version=$(sed -n 's/^black==\([^ #]*\).*/\1/p' requirements.txt)
          flake8_version=$(sed -n 's/^flake8==\([^ #]*\).*/\1/p' requirements.txt)
          echo "resolved: black==${black_version} flake8==${flake8_version}"
          python -m pip install --quiet "black==${black_version}" "flake8==${flake8_version}"

      - name: black --check --diff
        run: |
          set -euo pipefail
          # Line length comes from pyproject.toml ([tool.black] line-length = 100).
          black --check --diff \
            codegen/ analysis/ scripts/ uav_mpc/launch/ uav_mpc/test/

      - name: flake8
        run: |
          set -euo pipefail
          # Settings live in the committed setup.cfg; no inline flags.
          flake8

  yaml-and-xml:
    name: YAML / package.xml
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python gives this job its own interpreter. Without it, `pip install` hits
      # the runner's SYSTEM python, which Ubuntu 26.04 marks externally-managed (PEP 668) and
      # refuses — and the unversioned `python` alias may not exist at all. Both failure modes
      # disappear here, and it costs a few seconds.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: yamllint
        run: |
          set -euo pipefail
          python -m pip install --quiet yamllint
          # Relaxed line-length rule lives in the committed .yamllint, not inline.
          yamllint -c .yamllint uav_mpc/config/ uav_mpc/params/ acceptance_criteria.yaml

      # This job runs on the RUNNER, not in a container: the user is not root, so apt-get
      # needs sudo. (The cpp job above is the reverse — root, and sudo is not installed.)
      - name: xmllint package.xml
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          # Well-formedness is checked ALWAYS and needs no network.
          xmllint --noout uav_mpc/package.xml
          # Schema validation is best-effort: download.ros.org is not always reachable from a
          # runner, and a lint gate must not depend on a third-party host being up. The
          # authoritative schema check is ament_xmllint during `colcon test`.
          schema=/tmp/package_format3.xsd
          if curl -fsSL --max-time 30 https://download.ros.org/schema/package_format3.xsd -o "$schema"; then
            xmllint --noout --schema "$schema" uav_mpc/package.xml
            echo "package.xml validated against the format-3 schema"
          else
            echo "::notice::schema unreachable — well-formedness checked only"
          fi

      - name: Count TODO and UNVERIFIED markers
        run: |
          set -euo pipefail
          # A progress meter, not a gate. --exclude-dir=.github is required or this grep
          # pattern would match the workflow file it lives in.
          todos=$(grep -rnI "TODO" --exclude-dir=.git --exclude-dir=.github . | wc -l)
          unverified=$(grep -rnI "UNVERIFIED" --exclude-dir=.git --exclude-dir=.github . | wc -l)
          {
            echo "## Outstanding markers"
            echo ""
            echo "- TODO: **${todos}**"
            echo "- UNVERIFIED: **${unverified}**"
            echo ""
            echo "UNVERIFIED matters more than TODO: an unimplemented function is visible,"
            echo "an unverified constant is not."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TODO=${todos} UNVERIFIED=${unverified}"
