# Fast, no-build lint gate. Should finish in under two minutes so it is the first thing a
# contributor sees fail. See .deepseek/14_CI.md §14.2.
#
# Python lint settings live in the committed setup.cfg (flake8) and .yamllint — no inline
# flags, or the local run and the CI run drift apart.

name: format check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (ament linters)
    runs-on: ubuntu-26.04
    container:
      image: ros:lyrical-ros-base
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The ros-lyrical-ament-* linter debs may not be published yet (ENVIRONMENT §2.1 risk
      # V3). Try the debs first; if they are absent, install the ament linters from source
      # into the PEP 668 venv so the gate survives until the debs land.
      - name: Install ament linters
        run: |
          set -euxo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            ros-${ROS_DISTRO}-ament-cmake-clang-format \
            ros-${ROS_DISTRO}-ament-cmake-cpplint \
            ros-${ROS_DISTRO}-ament-cmake-uncrustify \
            || true
          if command -v ament_clang_format >/dev/null 2>&1; then
            echo "ament linters installed from debs"
          else
            echo "ros-${ROS_DISTRO} linter debs not published yet (risk V3) — installing from source"
            python3 -m venv --system-site-packages /opt/venv
            . /opt/venv/bin/activate
            for branch in "${ROS_DISTRO}" rolling; do
              if git ls-remote --heads https://github.com/ament/ament_lint.git "$branch" \
                  | grep -q "refs/heads/$branch"; then
                git clone --depth 1 --branch "$branch" \
                  https://github.com/ament/ament_lint.git /tmp/ament_lint
                break
              fi
            done
            [ -d /tmp/ament_lint ] || { echo "::error::cannot clone ament_lint"; exit 1; }
            pip install \
              /tmp/ament_lint/ament_clang_format \
              /tmp/ament_lint/ament_cpplint \
              /tmp/ament_lint/ament_uncrustify
            echo "/opt/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: clang-format (fail on any diff, print the fix)
        run: |
          set -euxo pipefail
          if ! ament_clang_format --config-file .clang-format \
              uav_mpc/src uav_mpc/include uav_mpc/test; then
            # Reformat and show the diff so the fix is copy-pasteable.
            ament_clang_format --config-file .clang-format --reformat \
              uav_mpc/src uav_mpc/include uav_mpc/test
            git diff -- uav_mpc || true
            echo "::error::clang-format would reformat the sources above. Fix with:"
            echo "  ament_clang_format --config-file .clang-format --reformat uav_mpc/src uav_mpc/include uav_mpc/test"
            exit 1
          fi

      - name: cpplint
        run: |
          set -euxo pipefail
          ament_cpplint --linelength 100 uav_mpc/src uav_mpc/include uav_mpc/test

      - name: uncrustify (fail on any diff, print the fix)
        run: |
          set -euxo pipefail
          if ! ament_uncrustify --linelength 100 \
              uav_mpc/src uav_mpc/include uav_mpc/test; then
            ament_uncrustify --linelength 100 --reformat \
              uav_mpc/src uav_mpc/include uav_mpc/test
            git diff -- uav_mpc || true
            echo "::error::uncrustify would reformat the sources above."
            exit 1
          fi

  python:
    name: Python (black / flake8)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # This job uses actions/setup-python, so PEP 668 does not apply here (ENVIRONMENT §2.3).
      # Black and flake8 are pinned in requirements.txt — take the versions from there rather
      # than restating them, so the two cannot drift.
      - name: Install pinned linters
        run: |
          pip install \
            "black==$(sed -n 's/^black==//p' requirements.txt)" \
            "flake8==$(sed -n 's/^flake8==//p' requirements.txt)"
      - name: black --check --diff
        run: |
          black --check --diff \
            codegen/ analysis/ scripts/ uav_mpc/launch/ uav_mpc/test/
      - name: flake8
        run: |
          # Settings live in the committed setup.cfg; no inline flags.
          flake8

  yaml-and-xml:
    name: YAML / package.xml
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install yamllint
          # Relaxed line-length rule lives in the committed .yamllint, not inline.
          yamllint -c .yamllint config/ params/
      - name: xmllint package.xml (format 3)
        run: |
          apt-get update -qq && apt-get install -y -qq libxml2-utils
          schema="/tmp/package_format3.xsd"
          curl -fsSL https://download.ros.org/schema/package_format3.xsd -o "$schema"
          xmllint --noout --schema "$schema" uav_mpc/package.xml

  docs:
    name: Docs are not stale
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Count TODO and UNVERIFIED markers
        run: |
          # A progress meter, not a gate, until v1.0. --exclude-dir=.deepseek is required:
          # the specification documents quote the marker string, and counting those would make
          # the meter never reach zero. --exclude-dir=.github is required for the same reason:
          # this very grep pattern lives in a workflow file.
          todos=$(grep -rn "TODO(deepseek)" --exclude-dir=.git --exclude-dir=.deepseek --exclude-dir=.github . | wc -l)
          unverified=$(grep -rn "UNVERIFIED" --exclude-dir=.git --exclude-dir=.deepseek --exclude-dir=.github . | wc -l)
          echo "## Docs are not stale" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- remaining \`TODO(deepseek)\` markers: **$todos**" >> "$GITHUB_STEP_SUMMARY"
          echo "- remaining \`UNVERIFIED\` markers: **$unverified**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "UNVERIFIED matters more than TODO: an unimplemented function is visible, an" >> "$GITHUB_STEP_SUMMARY"
          echo "unverified constant is not (see .deepseek/15_ROADMAP.md §17)." >> "$GITHUB_STEP_SUMMARY"
          echo "TODO(deepseek) count: $todos | UNVERIFIED count: $unverified"
          # Gate at v1.0 — uncomment the lines below.
          # if [ "$todos" -ne 0 ]; then echo "::error::TODO(deepseek) markers remain"; exit 1; fi
