# SKELETON — job structure defined, steps marked TODO.
#
# THE differentiating CI job: PX4 SITL + Gazebo + the NMPC node actually fly a hover, headless,
# inside the container, and the job asserts on the resulting tracking error. Most candidate
# repos do not build; this one flies autonomously in CI.
#
# Determinism is the budget here: fixed seeds, bounded timeouts, no sleep-and-hope. A smoke
# test that fails 30% of the time trains everyone to ignore red, which is worse than not
# having one.
#
# The sim image (PX4 + Gazebo Jetty + acados layered on ros:lyrical-ros-base) is BUILT by a
# separate manually-triggered workflow and published to GHCR; this workflow only pulls. If the
# pull fails, run that workflow first — building PX4 on every push would make this 40 minutes.

name: docker smoke test

# MANUAL TRIGGER ONLY, deliberately.
#
# This job cannot pass yet and must not run automatically:
#   *  — nothing bridges Gazebo to either vehicle backend. `sitl.launch.py` defaults to
#     `vehicle_interface:=px4`, and px4_msgs has no Lyrical Luth release, so the node refuses
#     to configure. There is no runnable simulation path.
#   *  — `docker/Dockerfile.sitl` and the image-publishing workflow referenced below do
#     not exist, so `SIM_IMAGE` cannot be pulled.
#
# Running it on every push would guarantee a permanently red badge on the landing page, which
# is worse than no badge: it trains everyone to ignore red. Acceptance criteria A6/A7 are
# therefore openly UNMET rather than silently failing.
#
# RE-ENABLE the `push` / `pull_request` / `schedule` triggers in the same commit that closes
#  and , and not before.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # REQUIRED. Jobs that run inside a container get /bin/sh (dash) by default,
    # and `. /opt/ros/$ROS_DISTRO/setup.bash` is full of bash-isms — it fails with
    # "Bad substitution" / "builtin: not found" and the job dies at step 1.
    shell: bash

env:
  # Pinned in ONE place: this file. colcon_build.yml mirrors PX4_VERSION and verifies the
  # mirror cannot drift (see its "Verify px4_msgs branch" step). px4_msgs MUST match PX4.
  # NOTE: Lyrical Luth is a young distro. Every pin below is a forward-looking guess — verify
  # each one against the release notes before trusting it.
  PX4_VERSION: "v1.16.0"     # UNVERIFIED — confirm which release supports Gazebo Jetty
  GZ_VERSION: "jetty"        # UNVERIFIED — confirm the Lyrical pairing in REP-2000
  ROS_DISTRO: "lyrical"
  SIM_IMAGE: ghcr.io/${{ github.repository }}:sitl-lyrical
  # acados is layered into the sim image at /opt/acados (see the image-build workflow).
  ACADOS_SOURCE_DIR: /opt/acados

jobs:
  hover:
    name: 10 s autonomous hover in SITL
    runs-on: ubuntu-latest   # the sim container determines the environment (risk V1)
    container:
      image: ${{ env.SIM_IMAGE }}
      options: --shm-size=1g
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/uav-mpc

      - name: Run the hover scenario
        run: |
          set -euxo pipefail
          source /opt/ros/$ROS_DISTRO/setup.bash
          export ACADOS_SOURCE_DIR
          export LD_LIBRARY_PATH="$ACADOS_SOURCE_DIR/lib:${LD_LIBRARY_PATH:-}"
          export ROS_DOMAIN_ID=42
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
          mkdir -p artifacts
          ros2 bag record -o artifacts/ci_hover_bag \
            /nmpc_node/status \
            /fmu/out/vehicle_local_position \
            /fmu/out/vehicle_attitude \
            /fmu/in/vehicle_attitude_setpoint \
            > artifacts/bag.log 2>&1 &
          BAG_PID=$!
          # 1.5 m at 0.5 m/s takeoff ramp + 10 s steady state + margin for sim boot.
          timeout 150 ros2 launch uav_mpc sitl.launch.py \
            headless:=true auto_arm:=true trajectory:=hover rviz:=false \
            > artifacts/launch.log 2>&1 &
          LAUNCH_PID=$!
          sleep 60
          kill -INT $LAUNCH_PID $BAG_PID || true
          wait $LAUNCH_PID || true
          wait $BAG_PID || true
          echo "--- launch.log tail ---"
          tail -n 80 artifacts/launch.log || true

      - name: Assert hover metrics
        run: |
          set -euxo pipefail
          source /opt/ros/$ROS_DISTRO/setup.bash
          # The assertions live in scripts/assert_hover.py so they run locally too.
          # Thresholds below are the §14.3 acceptance criteria (relaxed vs unit tests).
          python src/uav-mpc/scripts/assert_hover.py artifacts/ci_hover_bag \
            --window 10 --takeoff-altitude 1.5 --json artifacts/hover_metrics.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hover-artifacts
          path: |
            artifacts/
            build/uav_mpc/test_results/**/*.xml
          if-no-files-found: ignore

  figure8:
    name: 2 laps of a figure-8 in SITL
    runs-on: ubuntu-latest   # the sim container determines the environment (risk V1)
    container:
      image: ${{ env.SIM_IMAGE }}
      options: --shm-size=1g
    timeout-minutes: 60
    # Schedule + dispatch only, never on every push — keep the per-PR feedback loop short.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/uav-mpc

      - name: Run the figure-8 scenario
        run: |
          set -euxo pipefail
          source /opt/ros/$ROS_DISTRO/setup.bash
          export ACADOS_SOURCE_DIR
          export LD_LIBRARY_PATH="$ACADOS_SOURCE_DIR/lib:${LD_LIBRARY_PATH:-}"
          export ROS_DOMAIN_ID=42
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
          mkdir -p artifacts
          # Two full 8 s laps after the 12 s takeoff allowance, plus margin.
          timeout 180 ros2 launch uav_mpc figure8.launch.py \
            record:=true aggressive:=false laps:=2 takeoff_wait:=12.0 \
            headless:=true rviz:=false \
            > artifacts/launch.log 2>&1 &
          LAUNCH_PID=$!
          sleep 90
          kill -INT $LAUNCH_PID || true
          wait $LAUNCH_PID || true
          echo "--- launch.log tail ---"
          tail -n 80 artifacts/launch.log || true
          bag_dir=$(ls -d artifacts/figure8_* 2>/dev/null | head -1 || true)
          [ -n "$bag_dir" ] || { echo "::error::no figure8 bag was recorded"; exit 1; }
          echo "bag=$bag_dir" >> "$GITHUB_ENV"

      - name: Assert figure-8 metrics
        run: |
          set -euxo pipefail
          source /opt/ros/$ROS_DISTRO/setup.bash
          # Looser position thresholds than hover: RMS < 0.25 m (§14.3).
          python src/uav-mpc/scripts/assert_hover.py "$bag" \
            --window 10 --takeoff-altitude 1.5 --max-rms 0.25 \
            --json artifacts/figure8_metrics.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure8-artifacts
          path: artifacts/
          if-no-files-found: ignore
