# Builds the workspace from clean in a ROS 2 Lyrical Luth container and runs the unit tests.
# This is the badge on the README; it must be green or the repo has failed its first filter.
# See .deepseek/14_CI.md §14.1.
#
# PEP 668 applies: Ubuntu 26.04 refuses bare `pip install` into the system interpreter, so a
# venv created with --system-site-packages carries requirements.txt (see
# .deepseek/02_ENVIRONMENT.md §2.3). We do NOT reach for --break-system-packages.

name: colcon build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The single source of truth for the PX4 version is docker_smoke_test.yml. This value is a
  # mirror; a step below verifies the two cannot drift.
  PX4_VERSION: "v1.16.0"   # UNVERIFIED — see docker_smoke_test.yml
  ACADOS_SOURCE_DIR: ${{ github.workspace }}/acados

jobs:
  build:
    name: Lyrical Luth / Ubuntu 26.04
    runs-on: ubuntu-26.04
    container:
      image: ros:lyrical-ros-base
    timeout-minutes: 45
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/acados/lib

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/uav-mpc

      # ------------------------------------------------------------------ caches --------------
      # A 40-minute CI nobody waits for is a CI nobody trusts.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('src/uav-mpc/requirements.txt') }}
          restore-keys: pip-

      - name: Cache acados build
        uses: actions/cache@v4
        with:
          path: ${{ env.ACADOS_SOURCE_DIR }}
          key: acados-${{ hashFiles('src/uav-mpc/codegen/ACADOS_COMMIT') }}-${{ runner.os }}
          restore-keys: acados-

      - name: Cache colcon build / install / log
        uses: actions/cache@v4
        with:
          path: |
            build
            install
            log
          key: colcon-${{ hashFiles('src/uav-mpc/requirements.txt', 'src/uav-mpc/codegen/ACADOS_COMMIT') }}
          restore-keys: colcon-

      # ------------------------------------------------------------------ px4_msgs -------------
      - name: Verify px4_msgs branch matches docker_smoke_test.yml
        run: |
          pinned=$(grep -m1 '^[[:space:]]*PX4_VERSION:' \
            .github/workflows/docker_smoke_test.yml \
            | sed -E 's/.*PX4_VERSION:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$pinned" ] || [ "$pinned" != "$PX4_VERSION" ]; then
            echo "::error::PX4_VERSION drift: colcon_build.yml=$PX4_VERSION " \
                 "docker_smoke_test.yml=$pinned. Version skew between px4_msgs and PX4 is the" \
                 "#1 cause of a silent no-messages failure — pin both in one place (§14.1)."
            exit 1
          fi
          echo "PX4_VERSION $PX4_VERSION consistent with docker_smoke_test.yml"

      - name: Clone px4_msgs at the PX4 version
        run: |
          set -euxo pipefail
          if [ -d src/px4_msgs ]; then
            echo "px4_msgs restored from cache"
          else
            git clone --depth 1 --branch "$PX4_VERSION" \
              https://github.com/PX4/px4_msgs.git src/px4_msgs
          fi
          git -C src/px4_msgs rev-parse HEAD

      # ------------------------------------------------------------------ deps ------------------
      - name: Install system dependencies
        run: |
          set -euxo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake git \
            python3-pip python3-venv \
            python3-colcon-common-extensions python3-rosdep \
            libeigen3-dev
          . /opt/ros/$ROS_DISTRO/setup.bash
          rosdep init || true
          rosdep update

      - name: Create PEP 668 venv and install requirements
        run: |
          set -euxo pipefail
          # --system-site-packages: rclpy and the other ROS Python modules must stay importable.
          python3 -m venv --system-site-packages /opt/venv
          /opt/venv/bin/pip install -r src/uav-mpc/requirements.txt
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Build acados at the pinned commit
        run: |
          set -euxo pipefail
          if [ -f "$ACADOS_SOURCE_DIR/lib/libacados.so" ]; then
            echo "acados restored from cache"
          else
            mkdir -p "$ACADOS_SOURCE_DIR"
            git clone --recursive https://github.com/acados/acados.git "$ACADOS_SOURCE_DIR"
            git -C "$ACADOS_SOURCE_DIR" checkout "$(grep -E '^[0-9a-f]{40}$' \
              src/uav-mpc/codegen/ACADOS_COMMIT | head -1)"
            cmake -S "$ACADOS_SOURCE_DIR" -B "$ACADOS_SOURCE_DIR/build" \
              -DACADOS_WITH_QPOASES=ON \
              -DACADOS_WITH_OSQP=OFF \
              -DACADOS_WITH_HPIPM=ON \
              -DACADOS_WITH_OPENMP=ON \
              -DACADOS_INSTALL_DIR="$ACADOS_SOURCE_DIR"
            cmake --build "$ACADOS_SOURCE_DIR/build" --target install -j"$(nproc)"
            echo "LD_LIBRARY_PATH=$ACADOS_SOURCE_DIR/lib" >> "$GITHUB_ENV"
          fi
          /opt/venv/bin/pip install -e "$ACADOS_SOURCE_DIR/interfaces/acados_template"

      - name: Generate the solver
        run: |
          set -euxo pipefail
          if grep -qE '^[0-9a-f]{40}$' src/uav-mpc/codegen/ACADOS_COMMIT; then
            # codegen/codegen_output/ is gitignored (reproducible from codegen/), so the
            # solver is regenerated fresh here and its MODEL_HASH is checked by
            # test_generated_code_is_up_to_date. The moment a generated tree is ever committed,
            # switch this step to --check-only so staleness fails CI instead of being silently
            # regenerated (§14.1).
            python src/uav-mpc/codegen/generate_acados_solver.py
          else
            echo "::warning::codegen/ACADOS_COMMIT has no pinned SHA yet (risk V8). " \
                 "The acados pipeline is UNVERIFIED — pin a real SHA, then remove this guard."
          fi

      - name: rosdep install
        run: |
          set -euxo pipefail
          . /opt/ros/$ROS_DISTRO/setup.bash
          rosdep install --from-paths src -y --ignore-src

      - name: colcon build (Release)
        run: |
          set -euxo pipefail
          . /opt/ros/$ROS_DISTRO/setup.bash
          export ACADOS_SOURCE_DIR
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: colcon test
        env:
          # SOLVE-TIME NOISE decision (§14.1): the strict A2 p99 budget (acceptance_criteria.yaml)
          # is the repo's real-time claim and runs locally and on self-hosted runners.
          # GitHub-hosted shared runners are too noisy, so relax here via the environment
          # overrides consumed by test_nmpc_solve_time.cpp. Do NOT disable the test; these
          # overrides are the documented exception to acceptance_criteria.yaml.
          UAV_MPC_SOLVE_P99_BUDGET_MS: "5.0"
          UAV_MPC_SOLVE_MEDIAN_BUDGET_MS: "3.0"
        run: |
          set -euxo pipefail
          . /opt/ros/$ROS_DISTRO/setup.bash
          export ACADOS_SOURCE_DIR
          export LD_LIBRARY_PATH="$ACADOS_SOURCE_DIR/lib:${LD_LIBRARY_PATH:-}"
          colcon test --packages-select uav_mpc \
            && colcon test-result --verbose --all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/uav_mpc/test_results/**/*.xml
            log/latest/**/*.xml
          if-no-files-found: ignore

  build-no-acados:
    name: Stub backend (no acados)
    runs-on: ubuntu-26.04
    container:
      image: ros:lyrical-ros-base
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/uav-mpc

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake git \
            python3-colcon-common-extensions \
            libeigen3-dev

      - name: colcon build with UAV_MPC_WITH_ACADOS=OFF
        run: |
          set -euxo pipefail
          . /opt/ros/$ROS_DISTRO/setup.bash
          # Guards the abstraction boundary: if an acados header leaks out of
          # acados_wrapper.cpp, this job is what catches it. If it starts failing, fix the
          # leak — do NOT add the acados include path to this job.
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DUAV_MPC_WITH_ACADOS=OFF

      # Build-only by design: the stub solve-time tests trivially pass (a no-op solve is
      # ~0 ms), so testing here adds nothing the acados job does not already cover.
