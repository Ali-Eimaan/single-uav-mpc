# SKELETON — job structure defined, steps marked TODO. See .deepseek/14_CI.md §14.1.
#
# Builds the workspace from clean in a ROS 2 Lyrical Luth container and runs the unit tests.
# This is the badge on the README; it must be green or the repo has failed its first filter.

name: colcon build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lyrical Luth / Ubuntu 26.04
    runs-on: ubuntu-26.04
    container:
      image: ros:lyrical-ros-base
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/uav-mpc

      # TODO(deepseek): cache ~/.cache/pip, the acados build, and the colcon build/install
      # dirs keyed on the lockfiles + codegen/ACADOS_COMMIT. A 40-minute CI nobody waits for
      # is a CI nobody trusts.

      # TODO(deepseek): install system deps
      #   apt: build-essential cmake git python3-pip python3-venv
      #        python3-colcon-common-extensions python3-rosdep libeigen3-dev
      #   pip: Ubuntu 26.04 enforces PEP 668, so a bare `pip install` into the system
      #        interpreter is REFUSED. Create the venv with --system-site-packages (so the
      #        ROS 2 python modules stay importable) and install requirements.txt into it:
      #          python3 -m venv --system-site-packages /opt/venv
      #          /opt/venv/bin/pip install -r src/uav-mpc/requirements.txt
      #        then put /opt/venv/bin on PATH for every later step. Do NOT reach for
      #        --break-system-packages: it works until it corrupts a rosdep-installed package,
      #        and then the failure looks like a ROS bug.

      # TODO(deepseek): clone px4_msgs into src/ at the tag matching the PX4 version pinned in
      # docker_smoke_test.yml. Version skew between px4_msgs and PX4 is the #1 cause of a
      # silent no-messages failure — pin both in one place and reference it here.

      # TODO(deepseek): build acados at codegen/ACADOS_COMMIT
      #   cmake -DACADOS_WITH_QPOASES=ON -DACADOS_INSTALL_DIR=... ; make install
      #   pip install -e interfaces/acados_template
      #   export ACADOS_SOURCE_DIR / LD_LIBRARY_PATH for the later steps

      # TODO(deepseek): generate the solver
      #   python src/uav-mpc/codegen/generate_acados_solver.py --check-only
      # so a stale committed solver fails CI rather than being silently regenerated.

      # TODO(deepseek): rosdep update && rosdep install --from-paths src -y --ignore-src

      # TODO(deepseek): colcon build --event-handlers console_direct+ \
      #   --cmake-args -DCMAKE_BUILD_TYPE=Release
      # Release is mandatory: test_nmpc_solve_time asserts on optimised timings.

      # TODO(deepseek): colcon test --packages-select uav_mpc \
      #   && colcon test-result --verbose --all
      # NOTE: the solve-time assertions are NOISY on shared CI runners. Either run them with a
      # relaxed threshold here and the strict one in a dedicated self-hosted job, or mark them
      # as informational on GitHub-hosted runners. Decide, document the decision in the
      # workflow, and do not quietly disable the test.

      # TODO(deepseek): upload the test XML + the solve-time percentile JSON as artifacts.

  build-no-acados:
    name: Stub backend (no acados)
    runs-on: ubuntu-26.04
    container:
      image: ros:lyrical-ros-base
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/uav-mpc
      # TODO(deepseek): same build with -DUAV_MPC_WITH_ACADOS=OFF. Guards the
      # abstraction boundary — if an acados header leaks out of acados_wrapper.cpp, this job
      # is what catches it.
