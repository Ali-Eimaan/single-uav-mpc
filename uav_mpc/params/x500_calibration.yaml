# Holybro X500 v2 — the PX4 reference airframe (SYS_AUTOSTART 4001, gz_x500).
#
# UNVERIFIED: the values below are the PX4 SITL model's own numbers, taken from
# the Gazebo model SDF and the PX4 airframe config. Before v1.0, verify EVERY entry against:
#   - PX4-gazebo-models/models/x500/model.sdf        (mass, inertia, rotor positions)
#   - PX4-Autopilot/src/modules/simulation/gz_bridge (motor constants)
#   - Holybro X500 v2 datasheet                      (arm length, prop, motor kV)
# and record the source next to each number. An advisor WILL check these.

airframe:
  name: "x500_v2"
  source: "PX4 gz_x500 SDF + Holybro X500 v2 datasheet"
  verified: false            # UNVERIFIED: flip to true once cross-checked

  # --- mass properties ---------------------------------------------------------------------
  mass: 2.0                   # [kg] airframe + 4S 5000 mAh; SITL model uses 2.0  # SDF
  inertia:                    # [kg m^2] body frame, FLU; diagonal is adequate for a symmetric X
    ixx: 0.02166              # SDF
    iyy: 0.02166              # SDF
    izz: 0.04000              # SDF
    ixy: 0.0                  # SDF (symmetry)
    ixz: 0.0                  # SDF (symmetry)
    iyz: 0.0                  # SDF (symmetry)

  # --- geometry ------------------------------------------------------------------------------
  arm_length: 0.25            # [m] CoG to motor axis, in-plane. X500 has a 500 mm wheelbase.  # UNVERIFIED — check datasheet

  # --- propulsion ----------------------------------------------------------------------------
  # T_i = thrust_coeff * omega_i^2 ,  Q_i = torque_coeff * omega_i^2
  thrust_coeff: 8.54858e-06   # [N/(rad/s)^2]  motorConstant in the SITL SDF  # SDF
  torque_coeff: 1.3677728e-07  # [N m/(rad/s)^2] = thrust_coeff * momentConstant(0.016)  # derived from thrust_coeff
  max_rotor_speed: 1000.0     # [rad/s]  # SDF
  min_thrust_per_rotor: 0.5   # [N] keep the props spinning  # UNVERIFIED — idle thrust not in SDF
  max_thrust_per_rotor: 8.55  # [N] = thrust_coeff * max_rotor_speed^2  # derived
  rotor_time_constant: 0.0125  # [s] first-order motor+ESC lag  # UNVERIFIED — rough estimate, needs identification

  # Thrust-to-weight = 4 * 8.55 / (2.0 * 9.80665) = 1.74. Adequate for the 3 m / 5 s figure-8.

  # --- aerodynamics --------------------------------------------------------------------------
  drag_coeff: [0.10, 0.10, 0.05]  # [N s/m] linear rotor drag, body frame.  # UNVERIFIED — rough estimate
                                  # identify from a constant-velocity flight (TUNING_GUIDE §5).

  gravity: 9.80665            # [m/s^2]

  # --- PX4 interface ---------------------------------------------------------------------------
  px4_hover_thrust: 0.62      # normalised; must match MPC_THR_HOVER
  px4_airframe_id: 4001       # SYS_AUTOSTART
