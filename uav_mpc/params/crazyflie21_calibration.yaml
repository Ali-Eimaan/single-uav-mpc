# Bitcraze Crazyflie 2.1 — the indoor micro-quad target.
#
# UNVERIFIED: values below come from the Bitcraze published specifications and
# the widely cited system-identification papers (Förster 2015 MSc thesis; Landry 2015). Verify
# and cite each number in a trailing comment before v1.0. Do NOT invent numbers here — a
# fabricated inertia tensor is exactly the kind of thing a hardware advisor spots.

airframe:
  name: "crazyflie21"
  source: "Bitcraze CF2.1 datasheet; Foerster (2015) motor identification"
  verified: false            # UNVERIFIED: flip to true once cross-checked

  # --- mass properties ---------------------------------------------------------------------
  mass: 0.027                 # [kg] 27 g with the standard battery
  inertia:                    # [kg m^2]
    ixx: 1.657e-05
    iyy: 1.657e-05
    izz: 2.926e-05
    ixy: 0.0
    ixz: 0.0
    iyz: 0.0

  # --- geometry ------------------------------------------------------------------------------
  arm_length: 0.0325          # [m] 92 mm motor-to-motor diagonal => 32.5 mm arm
  rotor_configuration: "quad_x"

  # --- propulsion ----------------------------------------------------------------------------
  thrust_coeff: 2.88e-08      # [N/(rad/s)^2]
  torque_coeff: 7.24e-10      # [N m/(rad/s)^2]
  max_rotor_speed: 2618.0     # [rad/s] ~25000 rpm
  min_thrust_per_rotor: 0.001 # [N]
  max_thrust_per_rotor: 0.157 # [N] ~16 gf per motor
  rotor_time_constant: 0.015  # [s]

  # Thrust-to-weight = 4 * 0.157 / (0.027 * 9.80665) = 2.37.
  # NOTE: the CF2.1 has a much shorter attitude time constant than the X500 — the 100 Hz outer
  # loop is comparatively slower here. Re-check the timescale separation (TUNING_GUIDE §6)
  # before flying aggressive trajectories on this frame.

  # --- aerodynamics --------------------------------------------------------------------------
  drag_coeff: [0.006, 0.006, 0.003]  # [N s/m] non-negligible at CF scale

  gravity: 9.80665            # [m/s^2]

  # --- interface --------------------------------------------------------------------------------
  # The CF2.1 does not run PX4. hardware.launch.py routes through crazyflie_ros2 / Crazyswarm2,
  # which takes a (thrust, roll, pitch, yaw-rate) or full-state setpoint instead of
  # VehicleAttitudeSetpoint. See docs/HARDWARE_BRINGUP.md §4.
  backend: "crazyflie_ros2"
  px4_hover_thrust: null      # not applicable
  hover_pwm: 38000            # [0, 65535] approximate hover command, for the thrust map
