# Python lint configuration. Committed so the local run and the CI run cannot drift apart —
# format_check.yml invokes flake8 with no inline flags on purpose.

[flake8]
max-line-length = 100
# E203: whitespace before ':' — conflicts with black
# W503: line break before binary operator — conflicts with black
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    install,
    log,
    .venv,
    codegen/codegen_output
per-file-ignores =
    # Launch files legitimately shadow builtins in their argument names.
    uav_mpc/launch/*.py: A002

[tool:pytest]
testpaths = uav_mpc/test
markers =
    slow: tests that generate or run a solver; excluded from the fast CI job
